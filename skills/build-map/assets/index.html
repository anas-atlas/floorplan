<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Build maps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Two views: the board (every map as a card, one column per stage) and one map as a lean console
   (Inbox, Grill or Quiz, Progress). The console shows only what the owner has to act on; details open on click. */
:root {
  --bg: #f6f7f6; --panel: #ffffff; --fg: #1d2421; --muted: #66716c; --faint: #8f9994; --line: #d6dcd9; --accent: #2f6fb8;
  --s-none: #b4bcb8; --s-written: #8a6fd1; --s-committed: #2f6fb8; --s-sandbox: #c98a1b; --s-prod: #2f8a55;
  --ok: #2f8a55; --bad: #c0392b; --warn: #c98a1b; --ok-text: #25703f; --warn-text: #885800; --accent-ink: #ffffff;
  --hover: color-mix(in srgb, var(--fg) 6%, transparent);
  --f-body: "Atkinson Hyperlegible", system-ui, sans-serif; --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141917; --panel: #1c2320; --fg: #e3e9e6; --muted: #97a39e; --faint: #6f7b76; --line: #2f3833; --accent: #6aa2e6;
  --s-none: #5d6863; --s-written: #a993e6; --s-committed: #6aa2e6; --s-sandbox: #e0a63b; --s-prod: #5cbd84;
  --ok: #5cbd84; --bad: #ef6f5f; --warn: #e0a63b; --ok-text: #5cbd84; --warn-text: #e0a63b; --accent-ink: #10231a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141917; --panel: #1c2320; --fg: #e3e9e6; --muted: #97a39e; --faint: #6f7b76; --line: #2f3833; --accent: #6aa2e6;
  --s-none: #5d6863; --s-written: #a993e6; --s-committed: #6aa2e6; --s-sandbox: #e0a63b; --s-prod: #5cbd84;
  --ok: #5cbd84; --bad: #ef6f5f; --warn: #e0a63b; --ok-text: #5cbd84; --warn-text: #e0a63b; --accent-ink: #10231a; color-scheme: dark }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 var(--f-body); font-variant-numeric: tabular-nums; }
.wrap { max-width: 900px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 40px; display: grid; gap: 12px; }
::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); }
a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; text-decoration-thickness: 1px; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: inherit; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1 { font-size: 20px; margin: 0; text-wrap: balance; }
.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.hint { margin: 0; font-size: 13px; color: var(--muted); }
.hint.bad { color: var(--bad); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.btn { font: 600 13px var(--f-body); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; background: var(--panel); min-height: 32px; }
.chip { font: 600 12px var(--f-mono); color: var(--c); white-space: nowrap; }
.chip.warn { color: var(--warn-text); }
.who { font: 12px var(--f-mono); color: var(--muted); }
.empty { font-size: 15px; color: var(--muted); }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--c); }

/* console: header and stage dots */
.head { display: flex; align-items: center; gap: 10px; }
.back { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 6px; color: var(--muted); }
.back:hover { background: var(--hover); color: var(--fg); }
.head h1 { flex: 1; min-width: 0; }
.dots { display: flex; align-items: center; gap: 5px; flex: none; }
.dots b { font: 400 13px var(--f-body); color: var(--muted); margin-right: 4px; }
.dots i { width: 7px; height: 7px; border-radius: 4px; background: var(--line); }
.dots i.done { background: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.dots i.now { width: 18px; background: var(--accent); }
/* console: the build steps; click one to move the map there */
.steps { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: -4px; }
.step { font-size: 13px; padding: 3px 10px; border-radius: 12px; color: var(--faint); min-height: 26px; }
.step:hover { background: var(--hover); color: var(--fg); }
.step.done { color: color-mix(in srgb, var(--accent) 70%, var(--muted)); }
.step[aria-current="step"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.step.was { box-shadow: inset 0 0 0 1px var(--accent); }
.steps .who { align-self: center; margin-left: 6px; }
/* the step you are looking at (not the current one): a thin pill ring, same size as the others */
.step.sel { box-shadow: inset 0 0 0 1.5px var(--accent); color: var(--accent); }
/* keep the pill shape and size when focused; the global focus rule would square it */
.step:focus-visible { border-radius: 12px; outline-offset: 2px; }
.step { border: 0; line-height: 20px; box-sizing: border-box; }
/* console: the view of one step */
.viewing { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); padding: 5px 6px 5px 12px; min-height: 44px; box-sizing: border-box; border: 1px dashed var(--line); border-radius: 8px; }
.viewing span { flex: 1; min-width: 160px; }
/* fixed slots, so two cards are as wide as three: sizes stay the same from step to step */
.met { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
.m { background: color-mix(in srgb, var(--line) 35%, var(--bg)); border-radius: 8px; padding: 10px 12px; font-size: 13px; color: var(--muted); }
.m b { display: block; font-size: 22px; color: var(--fg); font-weight: 700; }
.m.bad b { color: var(--bad); } .m.ok b { color: var(--ok-text); }
.lanes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; align-items: start; }
.lanec { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; align-content: start; background: var(--panel); }
.lanec { min-width: 0; }
.lanec h3 { margin: 0; font-size: 15px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 8px; }
.lanec .line .tt { overflow-wrap: anywhere; }
.sti { display: inline-grid; place-items: center; width: 22px; height: 22px; flex: none; color: var(--c); }
.sti .i { width: 16px; height: 16px; }
.lanec h3 span { font-weight: 400; font-size: 13px; color: var(--muted); }
/* one row size for every list in every step: 44px high, 15px title, 13px value */
.chk { display: flex; align-items: center; gap: 10px; padding: 10px 12px; min-height: 44px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); font-size: 15px; }
.chk.bad { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.chk .pip { margin: 0 3px; }
.chk .i, .wait .i, .li-h .i, .fold .i, .it-h .pen .i { width: 16px; height: 16px; }
.chk .sub { display: block; font-size: 13px; color: var(--muted); }
.pane > p:not([class]) { margin: 0; font-size: 15px; color: var(--muted); }
.chk .i { color: var(--faint); } .chk.in .i { color: var(--ok); } .chk.sent .i { color: var(--accent); }
.chk .tt { flex: 1; min-width: 0; } .chk .val { font-size: 13px; color: var(--muted); }

.pane { display: grid; gap: 10px; }
/* Code map tab: modules on the left with what each uses, the repo's Floorplan map below */
.codeframe { padding-block: 0 40px; } .codeframe[hidden] { display: none; }
.codeframe iframe { width: 100%; height: min(78vh, 900px); border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.cmods { display: grid; gap: 2px; }
.cmod { display: flex; gap: 8px; align-items: baseline; width: 100%; text-align: left; padding: 6px 8px; border-radius: 6px; font-size: 15px; }
.cmod:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.cmod[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.cmod .tt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.cmod .val { font: 12px var(--f-mono); color: var(--muted); overflow-wrap: anywhere; text-align: right; max-width: 55%; }
.cmod.none .val { color: var(--faint); }
.nb { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.nb h4 { margin: 0 0 4px; font-size: 13px; color: var(--muted); font-weight: 600; }
.nb p { margin: 2px 0; font-size: 14px; overflow-wrap: anywhere; }
.nb .via { font: 11px var(--f-mono); color: var(--faint); }
.codelink { font: 600 11px var(--f-mono); color: var(--accent); padding: 0 4px; }
/* console: tabs */
.tabs { display: flex; gap: 20px; border-bottom: 1px solid var(--line); }
.tab { padding: 8px 0; margin-bottom: -1px; color: var(--muted); border-bottom: 2px solid transparent; display: inline-flex; align-items: center; gap: 6px; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--fg); font-weight: 700; }
.badge { font: 600 12px var(--f-mono); padding: 0 6px; border-radius: 9px; background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }

/* console: items. An item is one line; its body opens on click. */
.list { display: grid; gap: 8px; }
.it { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.it.dragging { opacity: .4; }
.it-h { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 12px 9px 6px; min-height: 42px; box-sizing: border-box; font-size: 15px; }
.grip { color: var(--faint); opacity: .35; cursor: grab; display: inline-flex; }
.it:hover .grip { opacity: 1; }
.k { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--c); }
.it-h .tt { flex: 1; min-width: 0; }
.it-b { padding: 0 12px 12px 42px; display: grid; gap: 6px; font-size: 15px; color: var(--muted); }
.it-b p { margin: 0; }
.it-b .q { color: var(--fg); }
.acts { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 4px; }
.ib { width: 32px; height: 32px; display: inline-grid; place-items: center; border-radius: 6px; color: var(--muted); }
.ib:hover { background: var(--hover); color: var(--fg); }
.ib.rec { color: var(--accent); }
.tb { height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); font-size: 15px; margin-inline: 2px; }
.tb:hover { border-color: var(--muted); }
.tb.rec { border-color: var(--accent); color: var(--accent); }
.nt { flex: 1; min-width: 120px; height: 32px; box-sizing: border-box; font: inherit; font-size: 15px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); margin-left: 4px; }
.nt::placeholder { color: var(--faint); }

/* console: light rows for things already handled (sent, decided) and progress lines */
.fold { display: flex; align-items: center; gap: 8px; padding: 8px 12px; min-height: 40px; box-sizing: border-box; font-size: 15px; color: var(--faint); border-radius: 6px; }
.fold:hover { color: var(--muted); }
.fold .i { width: 14px; height: 14px; transition: transform .15s; }
.fold[aria-expanded="false"] .i { transform: rotate(-90deg); }
.fold.ghost { display: none; }
.dragging-item .fold.ghost { display: flex; }
.fold.drop { outline: 2px dashed var(--accent); outline-offset: 2px; color: var(--accent); }
.lite { display: grid; }
.li-h { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 12px; min-height: 40px; box-sizing: border-box; border-radius: 8px; font-size: 15px; color: var(--muted); }
.li-h:hover { background: var(--hover); }
.li-h .i { width: 15px; height: 15px; color: var(--faint); }
.li-h .tt { flex: 1; min-width: 0; }
.li-h .val { color: var(--faint); font-size: 13px; text-align: right; }
.li-b { padding: 2px 12px 10px 37px; display: grid; gap: 4px; font-size: 15px; color: var(--faint); }
.li-b p { margin: 0; }
.li-b strong { color: var(--muted); font-weight: 700; }
.li-b .tb { justify-self: start; height: 28px; margin: 2px 0 0; }
.compose { display: flex; gap: 4px; align-items: center; }
.compose .nt { margin: 0; background: transparent; }

/* console: grill context and progress */
.ctx { background: color-mix(in srgb, var(--line) 35%, var(--bg)); border-radius: 8px; padding: 10px 12px; font-size: 15px; color: var(--muted); display: grid; gap: 4px; }
.ctx p { margin: 0; }
.prog { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.prog .bar { flex: 1; height: 6px; }
.line { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 15px; color: var(--muted); }
.line > span:not(.tt) { font-size: 13px; white-space: nowrap; }
.line .tt { flex: 1; min-width: 0; color: var(--fg); }
.line.bad .tt { color: var(--bad); }
/* changed since you last looked: a green ring, like Floorplan's recent-work cards */
.line.chg { box-shadow: 0 0 0 2px var(--ok); border-radius: 6px; padding-left: 6px; padding-right: 6px; }
.chg-tag { font: 600 11px var(--f-mono); color: var(--ok-text); }
.badge.new { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok-text); }
.chk.hl-important .i { color: var(--bad); } .chk.hl-worth .i { color: var(--warn); }
.pip { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--s-none); flex: none; box-sizing: border-box; }
.pip.on { background: var(--c); border-color: var(--c); }
.grp { font-size: 12px; color: var(--faint); margin: 6px 0 0; }
/* console: what the build is blocked on, one quiet line above the tabs; click to read it all */
.wait { width: 100%; display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--warn-text); padding: 10px 12px; min-height: 44px; border-radius: 8px; box-sizing: border-box; background: color-mix(in srgb, var(--warn) 12%, var(--panel)); }
.wait .i { width: 15px; height: 15px; }
.sec { font-size: 12px; color: var(--faint); margin: 6px 0 -4px; letter-spacing: .02em; }
.wait .tt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
.wait[aria-expanded="true"] .tt { white-space: normal; }
.wait:hover { background: color-mix(in srgb, var(--warn) 18%, var(--panel)); }

/* console: drafts wait for Send; the bar sticks to the bottom while any exist */
.it.draft { border-style: dashed; border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.it-h .val { font-size: 13px; color: var(--accent); max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.it-h .pen { color: var(--faint); }
.tb.picked, .ib.picked { background: color-mix(in srgb, var(--accent) 14%, var(--panel)); color: var(--accent); }
.dn { display: flex; align-items: center; gap: 10px; padding: 4px 4px 4px 12px; min-height: 40px; font-size: 15px; }
.dn .tt { flex: 1; min-width: 0; }
.sendbar { position: sticky; bottom: 12px; display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 14px; background: var(--panel); border: 1px solid var(--accent); border-radius: 10px; box-shadow: 0 6px 18px color-mix(in srgb, var(--fg) 12%, transparent); }
.sendbar .tt { flex: 1; font-weight: 700; font-size: 15px; }
.sendbar .go { width: 36px; height: 36px; display: inline-grid; place-items: center; border-radius: 8px; background: var(--accent); color: var(--accent-ink); }
.sendbar .go:hover { background: color-mix(in srgb, var(--accent) 85%, var(--fg)); }

/* console: delete, confirmed in place */
.head .ib { flex: none; }
.ib.danger:hover { color: var(--bad); }
.confirm { border: 1px solid var(--bad); border-radius: 8px; padding: 12px; display: grid; gap: 8px; font-size: 15px; background: var(--panel); }
.confirm p { margin: 0; color: var(--muted); }
.confirm b { font-size: 16px; }
.confirm label { display: flex; align-items: center; gap: 8px; }
.confirm .row { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
.tb.bad { border-color: var(--bad); color: var(--bad); }
@media (prefers-reduced-motion: reduce) { .fold .i { transition: none; } .col { transition: none; } }

/* board: all maps as one column per stage; drag a card (or Alt+arrow) to change its stage */
.wrap.wide { max-width: 1320px; }
.board { display: grid; grid-template-columns: repeat(6, minmax(190px, 1fr)); gap: 10px; align-items: start; overflow-x: auto; padding-bottom: 6px; }
.col { background: color-mix(in srgb, var(--line) 35%, var(--bg)); border: 1px solid transparent; border-radius: 8px; padding: 8px; display: grid; gap: 6px; align-content: start; min-height: 160px; transition: border-color .12s, background .12s; }
.col.over { border-color: var(--accent); border-style: dashed; background: color-mix(in srgb, var(--accent) 9%, var(--bg)); }
.col h2 { margin: 0 2px 2px; display: flex; justify-content: space-between; align-items: center; font: 700 12px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.col h2 .n { font: 600 12px var(--f-mono); letter-spacing: 0; }
.card { display: grid; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; color: inherit; text-decoration: none; cursor: grab; }
.card:hover { border-color: var(--accent); }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card.dragging { opacity: .45; }
.card.pending { opacity: .6; }
.card b { font-size: 15px; line-height: 1.3; overflow-wrap: anywhere; }
.card .bars { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.card .bar { height: 5px; }
.card .flags { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.col.archive .card { background: transparent; border-style: dashed; }
.col.archive .card b { font-weight: 400; color: var(--muted); }
.col .empty { font-size: 13px; padding: 10px 4px; text-align: center; }
/* a column folds to a thin strip: click its title to fold, click the strip to open; remembered per browser */
.colh { width: 100%; display: flex; align-items: center; gap: 4px; border-radius: 4px; color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; }
.colh:hover { color: var(--fg); }
.colh .i { width: 14px; height: 14px; transition: transform .12s; }
.colh .t { flex: 1; text-align: left; }
.col.folded { padding: 8px 0; justify-items: center; }
.col.folded h2 { margin: 0; }
.col.folded .colh { writing-mode: vertical-rl; width: auto; min-height: 144px; padding: 2px 0; gap: 8px; }
.col.folded .colh .i { transform: rotate(-90deg); }
.col.folded .colh .t { flex: none; }
@media (prefers-reduced-motion: reduce) { .colh .i { transition: none; } }
/* build diagram: a light component diagram drawn from the map. One column per actor, modules by depth,
   the data model in a dashed box, colour by build state, L-shaped arrows that never cross a box. */
.diagram { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 8px; overflow-x: auto; }
.diagram svg { display: block; width: 100%; height: auto; }
.diagram .box { fill: color-mix(in srgb, var(--c) 12%, var(--panel)); stroke: color-mix(in srgb, var(--c) 75%, var(--fg)); stroke-width: .75; }
.diagram .actor { fill: var(--panel); stroke: var(--muted); stroke-width: .75; }
.diagram .ttl { font: 600 14px var(--f-body); fill: var(--fg); }
.diagram .sub { font: 12px var(--f-body); fill: var(--muted); }
.diagram .small .ttl { font: 12px var(--f-body); }
.diagram .dm { fill: none; stroke: var(--muted); stroke-width: .75; stroke-dasharray: 4 4; }
.diagram .dml { font: 600 13px var(--f-body); fill: var(--muted); }
.diagram .arr { fill: none; stroke: var(--muted); stroke-width: 1; stroke-linejoin: round; }
.diagram .node { cursor: pointer; }
.diagram .node:hover .box, .diagram .node.on .box { stroke-width: 1.75; }
.diagram svg.focus .arr { opacity: .12; }
.diagram svg.focus .arr.hl { opacity: 1; stroke: var(--accent); stroke-width: 1.5; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); padding: 2px 4px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; background: var(--c); vertical-align: -1px; }
.mdet { display: grid; gap: 4px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); font-size: 15px; }
.mdet .hd { display: flex; align-items: center; gap: 10px; } .mdet .hd b { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.mdet p { margin: 0; font-size: 13px; color: var(--muted); }
/* any board not on the real port says so, so nobody answers on a copy by mistake */
.copytag { position: sticky; top: 0; z-index: 5; text-align: center; font-size: 13px; padding: 6px 16px; background: color-mix(in srgb, var(--warn) 22%, var(--bg)); color: var(--warn-text); }

/* ---------- responsive ----------
   Grid tracks may shrink below their content, so one long line can never widen the page. */
.wrap, .pane, .list { grid-template-columns: minmax(0, 1fr); }

    send(hasOpts ? { op: 'draft', match: +f.dataset.i, answer: dr && !dr.tuck ? dr.a : v, note: dr && !dr.tuck ? v : '' } : { op: 'draft', match: +f.dataset.i, answer: v });
  }
});

// Drag: board cards between columns; console items to reorder, or onto "Decided" to set them aside.
let dragSlug = '', dragItem = null;
app.addEventListener('dragstart', ev => {
  if (D) {
    const it = ev.target.closest && ev.target.closest('.it'); if (!it) return;
    dragItem = it; app.classList.add('dragging-item'); ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain', it.dataset.i);
    requestAnimationFrame(() => it.classList.add('dragging')); return;
  }
  const c = ev.target.closest && ev.target.closest('.card'); if (!c) return;
  dragSlug = c.dataset.slug; ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain', dragSlug);
  requestAnimationFrame(() => c.classList.add('dragging'));
});
function endDrag() {
  dragSlug = ''; dragItem = null; app.classList.remove('dragging-item');
  app.querySelectorAll('.dragging, .over, .drop').forEach(e => e.classList.remove('dragging', 'over', 'drop'));
  if (renderLater) { renderLater = false; render(); }
}
app.addEventListener('dragend', endDrag);
app.addEventListener('dragover', ev => {
  if (dragItem) {
    const tuck = ev.target.closest('[data-drop="tuck"]');
    app.querySelectorAll('.drop').forEach(e => { if (e !== tuck) e.classList.remove('drop'); });
    if (tuck) { ev.preventDefault(); tuck.classList.add('drop'); return; }
    const list = dragItem.parentElement, o = ev.target.closest('.it');
    if (!o || o === dragItem || o.parentElement !== list) { if (ev.target.closest('.list') === list) ev.preventDefault(); return; }
    ev.preventDefault(); const r = o.getBoundingClientRect();
    list.insertBefore(dragItem, ev.clientY < r.top + r.height / 2 ? o : o.nextSibling); return;
  }
  const col = dragSlug && ev.target.closest('.col'); if (!col) return;
  ev.preventDefault(); ev.dataTransfer.dropEffect = 'move';
  app.querySelectorAll('.col.over').forEach(e => { if (e !== col) e.classList.remove('over'); }); col.classList.add('over');
});
app.addEventListener('dragleave', ev => { const col = ev.target.closest('.col'); if (col && !col.contains(ev.relatedTarget)) col.classList.remove('over'); });
app.addEventListener('drop', ev => {
  if (dragItem) {
    ev.preventDefault(); const it = dragItem, tuck = ev.target.closest('[data-drop="tuck"]');
    const ids = [...it.parentElement.querySelectorAll('.it')].map(e => +e.dataset.i);
    dragItem = null; renderLater = false; endDrag();
    if (tuck) send({ op: 'draft', match: +it.dataset.i, answer: 'Set aside', tuck: true });
    else send({ op: 'order', ids });
    return;
  }
  const col = dragSlug && ev.target.closest('.col'); if (!col) return;
  ev.preventDefault(); const s = dragSlug; dragSlug = ''; renderLater = false; move(s, col.dataset.col);
});
app.addEventListener('keydown', ev => {
  const c = !D && ev.altKey && (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') && ev.target.closest('.card'); if (!c) return;
  ev.preventDefault(); const m = A(maps).find(x => x.slug === c.dataset.slug); if (!m) return;
  const i = COLS.indexOf(COL_OF(m.stage)) + (ev.key === 'ArrowRight' ? 1 : -1); if (i >= 0 && i < COLS.length) move(m.slug, COLS[i]);
});
addEventListener('hashchange', () => { ui.msg = ''; ui.exp = {}; ui.del = false; load(); });
async function delMap(cleanup) {
  try { await api(`/api/map/${slug}/delete`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ confirm: slug, cleanup }) }); }
  catch (e) { ui.msg = `Could not delete: ${e.message}`; render(); return; }
  ui.del = false; location.hash = '#/';
}

// Live updates: the server tells every open page when a map file changes (our own edits, the CLI, or an agent).
let reloadTimer;
function connect() {
  const es = new EventSource('/api/events');
  es.onopen = () => { ui.live = true; if (!D) render(); };
  es.onerror = () => { ui.live = false; };
  es.onmessage = ev => { let m = {}; try { m = JSON.parse(ev.data); } catch (e) {} if (!slug || m.slug === slug) { clearTimeout(reloadTimer); reloadTimer = setTimeout(load, 60); } };
}
load(); connect();
</script>
